[project]
name = "gemini-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "google-genai>=2.25",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "numpy>=1.26",
  "websockets>=12",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
